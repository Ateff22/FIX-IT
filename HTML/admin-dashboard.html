<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FixIt - Admin</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <div class="navbar">
    <div class="brand">FixIt Admin</div>
    <div class="nav-right">
      <span id="userName"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="page-title">
      <h2>All users</h2>
    </div>

    <table id="usersTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Specialty</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="usersBody">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>

    <div class="page-title" style="margin-top: 40px;">
      <h2>All requests</h2>
    </div>

    <table id="requestsTable">
      <thead>
        <tr>
          <th>Title</th>
          <th>Specialty</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="requestsBody">
        <tr><td colspan="4">Loading...</td></tr>
      </tbody>
    </table>

    <div class="page-title" style="margin-top: 40px;">
      <h2>All reviews</h2>
    </div>

    <table id="ratingsTable">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Technician</th>
          <th>Stars</th>
          <th>Comment</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ratingsBody">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    document.getElementById('userName').textContent = 'Hi,Admin: ' + localStorage.getItem('name');

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    async function loadUsers() {
      try {
        const res = await fetch('http://localhost:5000/api/admin/users', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        document.getElementById('usersBody').innerHTML = data.map(u => `
          <tr>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td>${u.role === 'technician' ? (u.specialty || 'Not set') : '-'}</td>
            <td>${u.isActive ? 'Active' : 'Banned'}</td>
            <td><button class="btn-small" onclick="toggleBan('${u._id}')">${u.isActive ? 'Ban' : 'Unban'}</button></td>
          </tr>
        `).join('');

      } catch (err) {
        document.getElementById('usersBody').innerHTML = '<tr><td colspan="6">Could not load users.</td></tr>';
      }
    }

    async function toggleBan(userId) {
      try {
        const res = await fetch('http://localhost:5000/api/admin/users/' + userId + '/ban', {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.message || 'Could not update user');
          return;
        }

        loadUsers();

      } catch (err) {
        alert('Could not connect to server');
      }
    }

    async function loadRequests() {
      try {
        const res = await fetch('http://localhost:5000/api/requests', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        document.getElementById('requestsBody').innerHTML = data.map(r => `
          <tr>
            <td>${r.title}</td>
            <td>${r.specialty}</td>
            <td>${r.status}</td>
            <td><button class="btn-small" onclick="deleteRequest('${r._id}')">Delete</button></td>
          </tr>
        `).join('');

      } catch (err) {
        document.getElementById('requestsBody').innerHTML = '<tr><td colspan="4">Could not load requests.</td></tr>';
      }
    }

    async function deleteRequest(id) {
      if (!confirm('Delete this request?')) return;

      try {
        const res = await fetch('http://localhost:5000/api/requests/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.message || 'Could not delete request');
          return;
        }

        loadRequests();

      } catch (err) {
        alert('Could not connect to server');
      }
    }

    async function loadRatings() {
      try {
        const res = await fetch('http://localhost:5000/api/admin/ratings', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        document.getElementById('ratingsBody').innerHTML = data.map(r => `
          <tr>
            <td>${r.customer ? r.customer.name : 'N/A'}</td>
            <td>${r.technician ? r.technician.name : 'N/A'}</td>
            <td>${r.stars}</td>
            <td>${r.comment || ''}</td>
            <td><button class="btn-small" onclick="deleteRating('${r._id}')">Delete</button></td>
          </tr>
        `).join('');

      } catch (err) {
        document.getElementById('ratingsBody').innerHTML = '<tr><td colspan="5">Could not load reviews.</td></tr>';
      }
    }

    async function deleteRating(id) {
      if (!confirm('Delete this review?')) return;

      try {
        const res = await fetch('http://localhost:5000/api/admin/ratings/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.message || 'Could not delete review');
          return;
        }

        loadRatings();

      } catch (err) {
        alert('Could not connect to server');
      }
    }

    loadUsers();
    loadRequests();
    loadRatings();
  </script>

</body>
</html>
