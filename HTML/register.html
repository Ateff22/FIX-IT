<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FixIt - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <div class="left-panel">
      <div class="brand">FixIt</div>
      <div class="hero-text">
        <h1>Join FixIt as a <span class="highlight">customer</span> or <span class="highlight">technician</span>.</h1>
        <p>Create an account to start posting repair requests or offering your services.</p>
      </div>
      <div class="footer-note">© 2026 FixIt Maintenance Services</div>
    </div>

    <div class="right-panel">
      <h2>Create an account</h2>
      <p class="subtitle">Fill in your details to get started.</p>

      <form id="registerForm">
        <label>Full name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <label>Phone number</label>
        <input type="text" id="phone" required>

        <label>I am a</label>
        <select id="role" required>
          <option value="customer">Customer</option>
          <option value="technician">Technician</option>
        </select>

        <button type="submit">Create account</button>
      </form>

      <p class="signup-note">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value;
      const role = document.getElementById('role').value;

      try {
        const res = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role,phone })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.message || (data.errors ? data.errors[0].msg : 'Registration failed'));
          return;
        }

        alert('Account created, please log in');
        window.location.href = 'login.html';

      } catch (err) {
        alert('Could not connect to server');
      }
    });
  </script>

</body>
</html>
