<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FixIt - New Request</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <div class="navbar">
    <div class="brand">FixIt</div>
    <div class="nav-right">
      <button onclick="window.location.href='customer-dashboard.html'">Back</button>
    </div>
  </div>

  <div class="form-card">
    <h2 style="margin-bottom: 20px;">New service request</h2>

    <form id="requestForm">
      <label>Title</label>
      <input type="text" id="title" required>

      <label>Description</label>
      <textarea id="description" rows="3" required></textarea>

      <label>Specialty</label>
      <select id="specialty" required>
        <option value="washing-machine">Washing machine</option>
        <option value="ac">AC</option>
        <option value="plumbing">Plumbing</option>
        <option value="electrical">Electrical</option>
      </select>

      <label>Location</label>
      <input type="text" id="location" required>

      <label>Photo (optional)</label>
      <input type="file" id="photo">

      <button type="submit">Submit request</button>
    </form>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('specialty', document.getElementById('specialty').value);
      formData.append('location', document.getElementById('location').value);

      const photoFile = document.getElementById('photo').files[0];
      if (photoFile) formData.append('photo', photoFile);

      try {
        const res = await fetch('http://localhost:5000/api/requests', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.message || 'Could not create request');
          return;
        }

        window.location.href = 'customer-dashboard.html';

      } catch (err) {
        alert('Could not connect to server');
      }
    });
  </script>

</body>
</html>
